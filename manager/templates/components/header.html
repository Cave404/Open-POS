<!-- Global Navigation Header Component -->
<div class="header-global-actions">
    {% if request.path != '/manager/addons' and request.endpoint != 'manager.manager_addons' and request.endpoint != 'manager.addons' %}
    <a href="/manager/addons" class="btn-nav-addon-manager" title="Open Addon Manager">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7s2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5a2.5 2.5 0 0 0 0-5z"/>
        </svg>
        <span>Addon Manager</span>
    </a>
    {% endif %}
    <div class="notification-bell-wrapper">
        <div class="notification-wrapper">
            <button id="notifBellBtn" class="btn-icon-tray" title="System Notifications">
                🔔 <span id="notifBadge" class="badge-count" style="display: none;">0</span>
            </button>
            <div id="notifDropdown" class="notif-dropdown-menu" style="display: none;">
                <div class="notif-dropdown-header">
                    <span>System Notifications</span>
                    <button id="clearNotifsBtn" class="btn-text-action">Clear</button>
                </div>
                <div id="notifList" class="notif-dropdown-body">
                    <!-- Populated dynamically via notifications.js -->
                </div>
                <div class="notif-dropdown-footer">
                    <a href="/manager/logs" class="btn-full-action">Open Terminal Logs &rarr;</a>
                </div>
            </div>
        </div>
    </div>
    <span class="status-pill status-online">Engine: Online</span>
    <a href="/manager/about" class="version-badge-link" title="View System Credits &amp; Documentation">v1.0.9</a>
</div>
