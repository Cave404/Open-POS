<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Authentication Required - Open-POS</title>
    <link rel="stylesheet" href="/static/css/manager.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #0f1117;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: #f1f5f9;
        }
        .view-container.locked {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .auth-lock-card {
            background: #1a1d24;
            border: 1px solid #2d3343;
            border-radius: 14px;
            padding: 2.2rem 2.5rem;
            max-width: 440px;
            width: 90%;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(59, 130, 246, 0.15);
            box-sizing: border-box;
        }
        .lock-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.12);
            color: #3b82f6;
            margin: 0 auto;
        }
        .text-primary {
            color: #3b82f6;
        }
        .letter-spacing-lg {
            letter-spacing: 4px;
            font-size: 1.25rem;
        }
        .form-control {
            background: #222631;
            border: 1px solid #3d4455;
            color: #f1f5f9;
            border-radius: 8px;
            padding: 12px 16px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }
        .form-control.is-invalid {
            border-color: #ef4444;
        }
        .invalid-feedback {
            color: #f87171;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            text-align: center;
        }
        .btn {
            display: inline-block;
            font-weight: 600;
            text-align: center;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.2s;
            border: none;
            font-size: 0.95rem;
        }
        .btn-primary {
            background: #3b82f6;
            color: #ffffff;
        }
        .btn-primary:hover {
            background: #2563eb;
        }
        .btn-outline-secondary {
            background: transparent;
            color: #94a3b8;
            border: 1px solid #3d4455;
        }
        .btn-outline-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #f1f5f9;
            border-color: #64748b;
        }
        .d-none { display: none !important; }
        .w-100 { width: 100%; }
        .text-center { text-align: center; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-3 { margin-bottom: 1rem; }
        .mb-4 { margin-bottom: 1.5rem; }
        .p-4 { padding: 1.5rem; }
        .fw-bold { font-weight: 700; }
        .small { font-size: 0.875rem; }
        .text-muted { color: #94a3b8; }
        .version-badge {
            display: block;
            margin-top: 1.5rem;
            font-size: 11px;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="view-container locked" id="serverLockoutBackdrop">
    <div class="auth-lock-card bg-card border-subtle p-4 text-center">
        <div class="lock-icon mb-3">
            <svg width="48" height="48" fill="currentColor" viewBox="0 0 16 16" class="text-primary">
                <path d="M8 1a2 2 0 0 0-2 2v4H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2m0 1a1 1 0 0 1 1 1v4H7V3a1 1 0 0 1 1-1"/>
            </svg>
        </div>
        <h4 class="fw-bold mb-2">Manager Authentication Required</h4>
        <p class="text-muted small mb-4">Enter administrative PIN to access protected store settings.</p>

        <form id="managerLockForm">
            <input type="hidden" id="nextUrl" value="{{ next_url }}">
            <div class="mb-3">
                <input type="password" 
                       id="adminPinInput" 
                       class="form-control form-control-lg text-center letter-spacing-lg" 
                       placeholder="Enter PIN" 
                       autocomplete="off" 
                       autofocus 
                       required>
                <div id="pinError" class="invalid-feedback text-danger small mt-2 d-none"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 mb-2" id="btnSubmitUnlock">
                Unlock Section
            </button>
            <a href="/manager" class="btn btn-outline-secondary w-100" id="btnReturnDashboard">
                Return to Dashboard
            </a>
            <span style="display:none;">&larr; Return to Home</span>
        </form>
        <span class="version-badge">Open-POS v1.0.9</span>
    </div>
</div>
<script src="/static/js/auth_lock.js"></script>
</body>
</html>
