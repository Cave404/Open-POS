<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Logs &amp; Diagnostics - Open-POS</title>
    <link rel="stylesheet" href="/static/css/manager.css">
    <script src="/static/js/notifications.js"></script>
    <style>
        .logs-container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .logs-table-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .logs-table-wrapper {
            max-height: 520px;
            overflow-y: auto;
        }

        table.logs-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
        }

        table.logs-table th {
            background-color: var(--bg-card);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            padding: 12px 18px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 5;
        }

        table.logs-table td {
            padding: 10px 18px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            vertical-align: middle;
        }

        table.logs-table tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .col-time { width: 110px; font-family: monospace; color: var(--text-muted); font-size: 11px; }
        .col-sub { width: 140px; font-family: monospace; font-size: 11px; }
        .col-lvl { width: 100px; }
        .col-msg { font-family: "Courier New", Courier, monospace; word-break: break-word; }

        .sub-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 4px;
            color: #93c5fd;
        }
    </style>
</head>
<body class="manager-body">

    <!-- Standardized Subview Header -->
    <header class="subview-header">
        <div class="header-left">
            <a href="/manager" class="btn-back" id="btnReturnDashboard">
                <span class="btn-icon">←</span>
                <span>Return to Dashboard</span>
            </a>
            <div class="header-divider"></div>
            <h2 class="subview-title">Terminal Logs &amp; Diagnostics</h2>
        </div>
        <div class="header-right">
            <!-- Addon Manager Global Navigation Button -->
            <a href="/manager/addons" class="btn-nav-addon-manager" title="Open Addon Manager">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7s2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5a2.5 2.5 0 0 0 0-5z"/>
                </svg>
                <span>Addon Manager</span>
            </a>
            <!-- Live Notifications Trigger -->
            <div class="notification-wrapper">
                <button id="notifBellBtn" class="btn-icon-tray" title="System Notifications">
                    🔔 <span id="notifBadge" class="badge-count" style="display: none;">0</span>
                </button>
                <div id="notifDropdown" class="notif-dropdown-menu" style="display: none;">
                    <div class="notif-dropdown-header">
                        <span>System Notifications</span>
                        <button id="clearNotifsBtn" class="btn-text-action">Clear</button>
                    </div>
                    <div id="notifList" class="notif-dropdown-body">
                        <!-- Populated dynamically -->
                    </div>
                    <div class="notif-dropdown-footer">
                        <a href="/manager/logs" class="btn-full-action">Open Terminal Logs →</a>
                    </div>
                </div>
            </div>
            <span class="status-pill status-online">Engine: Online</span>
            <a href="/manager/about" class="version-badge-link">v1.0.9</a>
        </div>
    </header>

    <div class="view-container">
        <div class="logs-container">

            <!-- Toolbar: Filters & Actions -->
            <div class="logs-toolbar">
                <div class="toolbar-filters">
                    <input type="text" id="logSearchInput" class="log-input" placeholder="Search message content..." style="width: 220px;">
                    <select id="logLevelSelect" class="log-select">
                        <option value="ALL">All Log Levels</option>
                        <option value="INFO">INFO</option>
                        <option value="WARNING">WARNING</option>
                        <option value="ERROR">ERROR</option>
                        <option value="CRITICAL">CRITICAL</option>
                    </select>
                    <select id="logSubsystemSelect" class="log-select">
                        <option value="ALL">All Subsystems</option>
                        <option value="CORE">CORE (Engine)</option>
                        <option value="NFC">NFC Scanner</option>
                        <option value="PRICE_ENGINE">Price Engine</option>
                        <option value="DISCORD">Discord Bot</option>
                        <option value="DATABASE">Database</option>
                    </select>
                </div>
                <div class="toolbar-actions">
                    <button type="button" class="btn-action-sm" id="btnRefreshLogs">
                        <span>🔄</span> Refresh
                    </button>
                    <a href="/api/logs/export/csv" class="btn-action-sm" id="btnExportCsv">
                        <span>📥</span> Export CSV
                    </a>
                    <a href="/api/logs/download/txt" class="btn-action-sm" id="btnDownloadLog">
                        <span>📄</span> Download .txt
                    </a>
                    <button type="button" class="btn-action-sm btn-action-primary" id="btnOpenLiveTerminal">
                        <span>⚡</span> Live Process Terminal
                    </button>
                </div>
            </div>

            <!-- Logs Table -->
            <div class="logs-table-card">
                <div class="logs-table-wrapper">
                    <table class="logs-table">
                        <thead>
                            <tr>
                                <th class="col-time">Time</th>
                                <th class="col-sub">Subsystem</th>
                                <th class="col-lvl">Level</th>
                                <th class="col-msg">Log Trace Message</th>
                            </tr>
                        </thead>
                        <tbody id="logsTableBody">
                            <tr>
                                <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 30px;">
                                    Loading system telemetry traces...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- Live Subsystem Terminal Modal -->
    <div id="terminalModal" class="terminal-modal-overlay" style="display: none;">
        <div class="terminal-window">
            <div class="terminal-titlebar">
                <div class="terminal-titlebar-left">
                    <span>⚡ LIVE PROCESS TERMINAL</span>
                    <select id="streamSubsystemSelect" class="log-select" style="background: #21262d; border-color: #30363d; font-size: 11px; padding: 4px 8px;">
                        <option value="CORE">Core Flask Service</option>
                        <option value="NFC">USB NFC Daemon</option>
                        <option value="PRICE_ENGINE">Price Engine Daemon</option>
                        <option value="DISCORD">Discord Bot Daemon</option>
                    </select>
                </div>
                <div class="terminal-controls">
                    <button type="button" class="btn-action-sm" id="btnPauseStream" style="background: #21262d; font-size: 11px; padding: 4px 10px;">
                        ⏸ Pause
                    </button>
                    <button type="button" class="btn-action-sm" id="btnClearTerminal" style="background: #21262d; font-size: 11px; padding: 4px 10px;">
                        🧹 Clear
                    </button>
                    <button type="button" class="btn-action-sm" id="btnCloseTerminal" style="background: #21262d; font-size: 11px; padding: 4px 10px; color: #f85149;">
                        ✕ Close
                    </button>
                </div>
            </div>
            <div id="terminalScreen" class="terminal-screen">
                <!-- Streamed line output -->
            </div>
        </div>
    </div>

<script>
let allLogs = [];
let eventSource = null;
let isPaused = false;

async function fetchLogs() {
    try {
        const res = await fetch('/api/logs');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        allLogs = data.logs || [];
        renderLogsTable();
    } catch (err) {
        console.error('Failed to fetch logs:', err);
        document.getElementById('logsTableBody').innerHTML = `
            <tr>
                <td colspan="4" style="text-align: center; color: var(--danger); padding: 24px;">
                    Failed to fetch logs: ${err.message}
                </td>
            </tr>
        `;
    }
}

function renderLogsTable() {
    const tbody = document.getElementById('logsTableBody');
    const search = document.getElementById('logSearchInput').value.toLowerCase().trim();
    const lvlFilter = document.getElementById('logLevelSelect').value;
    const subFilter = document.getElementById('logSubsystemSelect').value;

    const filtered = allLogs.filter(log => {
        if (lvlFilter !== 'ALL' && (log.level || '').toUpperCase() !== lvlFilter) return false;
        if (subFilter !== 'ALL' && (log.subsystem || '').toUpperCase() !== subFilter) return false;
        if (search && !log.message.toLowerCase().includes(search) && !log.subsystem.toLowerCase().includes(search)) return false;
        return true;
    });

    tbody.innerHTML = '';
    if (filtered.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 30px;">
                    No log traces match the specified filter criteria.
                </td>
            </tr>
        `;
        return;
    }

    filtered.forEach(log => {
        const tr = document.createElement('tr');
        const lvlClass = `tag-${(log.level || 'info').toLowerCase()}`;
        tr.innerHTML = `
            <td class="col-time">${log.timestamp}</td>
            <td class="col-sub"><span class="sub-chip">${log.subsystem}</span></td>
            <td class="col-lvl"><span class="notif-tag ${lvlClass}">${log.level}</span></td>
            <td class="col-msg">${escapeHtml(log.message)}</td>
        `;
        tbody.appendChild(tr);
    });
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// Live SSE Stream Handler
function startLiveTerminal(subsystem) {
    if (eventSource) {
        eventSource.close();
        eventSource = null;
    }

    const screen = document.getElementById('terminalScreen');
    screen.innerHTML = `<div class="term-line" style="color:#58a6ff;">[*] Connecting live telemetry stream for [${subsystem}]...</div>`;

    eventSource = new EventSource(`/api/logs/live_stream?subsystem=${encodeURIComponent(subsystem)}`);

    eventSource.onmessage = (e) => {
        if (isPaused) return;
        try {
            const data = JSON.parse(e.data);
            const line = document.createElement('div');
            line.className = 'term-line';
            const lvlClass = `term-lvl-${(data.level || 'info').toLowerCase().slice(0,4)}`;
            line.innerHTML = `
                <span class="term-time">[${data.timestamp}]</span>
                <span class="term-sub">[${data.subsystem}]</span>
                <span class="${lvlClass}">[${data.level}]</span>
                <span class="term-msg">${escapeHtml(data.message)}</span>
            `;
            screen.appendChild(line);
            screen.scrollTop = screen.scrollHeight;
        } catch (err) {
            const line = document.createElement('div');
            line.className = 'term-line';
            line.textContent = e.data;
            screen.appendChild(line);
            screen.scrollTop = screen.scrollHeight;
        }
    };

    eventSource.onerror = () => {
        const line = document.createElement('div');
        line.className = 'term-line';
        line.style.color = '#f85149';
        line.textContent = '[!] Stream disconnected. Reconnecting...';
        screen.appendChild(line);
    };
}

function stopLiveTerminal() {
    if (eventSource) {
        eventSource.close();
        eventSource = null;
    }
}

// Event Listeners
document.getElementById('logSearchInput').addEventListener('input', renderLogsTable);
document.getElementById('logLevelSelect').addEventListener('change', renderLogsTable);
document.getElementById('logSubsystemSelect').addEventListener('change', renderLogsTable);
document.getElementById('btnRefreshLogs').addEventListener('click', fetchLogs);

// Modal Controls
document.getElementById('btnOpenLiveTerminal').addEventListener('click', () => {
    document.getElementById('terminalModal').style.display = 'flex';
    const sub = document.getElementById('streamSubsystemSelect').value;
    startLiveTerminal(sub);
});

document.getElementById('btnCloseTerminal').addEventListener('click', () => {
    document.getElementById('terminalModal').style.display = 'none';
    stopLiveTerminal();
});

document.getElementById('streamSubsystemSelect').addEventListener('change', (e) => {
    startLiveTerminal(e.target.value);
});

document.getElementById('btnClearTerminal').addEventListener('click', () => {
    document.getElementById('terminalScreen').innerHTML = '';
});

document.getElementById('btnPauseStream').addEventListener('click', (e) => {
    isPaused = !isPaused;
    e.target.textContent = isPaused ? '▶ Resume' : '⏸ Pause';
    e.target.style.color = isPaused ? '#e3b341' : '#ffffff';
});

document.addEventListener('DOMContentLoaded', fetchLogs);
</script>
</body>
</html>
