<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open-POS System Startup</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1d24;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f1f5f9;
        }

        /* Full-size splash graphic container */
        .splash-frame {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: url('/manager/splash_image') center center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            cursor: default;
        }

        /* Bottom overlay gradient shielding progress indicators */
        .bottom-overlay {
            width: 100%;
            background: linear-gradient(to top, rgba(15, 17, 23, 0.95) 0%, rgba(15, 17, 23, 0.75) 65%, transparent 100%);
            padding: 24px 28px 20px 28px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Status message and percentage counter */
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .status-message {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            color: #e2e8f0;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.2px;
        }

        .status-spinner {
            width: 12px;
            height: 12px;
            border: 2px solid rgba(59, 130, 246, 0.25);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .percentage-text {
            font-weight: 700;
            font-family: monospace;
            font-size: 13px;
            color: #60a5fa;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        /* Progress track and animated bar */
        .progress-track {
            width: 100%;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.12);
            border-radius: 3px;
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #3b82f6, #60a5fa);
            border-radius: 3px;
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
        }
    </style>
</head>
<body>

    <div class="splash-frame">
        <div class="bottom-overlay">
            <div class="status-row">
                <div class="status-message">
                    <span class="status-spinner" id="statusSpinner"></span>
                    <span id="statusLabel">Initializing Open-POS engine...</span>
                </div>
                <div class="percentage-text" id="percentLabel">0%</div>
            </div>

            <div class="progress-track">
                <div class="progress-fill" id="progressBar"></div>
            </div>
        </div>
    </div>

<script>
/**
 * Global progress update interface invoked from Python via window.evaluate_js()
 */
window.updateProgress = function(percent, message) {
    const bar = document.getElementById('progressBar');
    const status = document.getElementById('statusLabel');
    const percentLabel = document.getElementById('percentLabel');
    const spinner = document.getElementById('statusSpinner');

    if (bar) {
        bar.style.width = Math.min(100, Math.max(0, percent)) + '%';
    }
    if (status && message) {
        status.textContent = message;
    }
    if (percentLabel) {
        percentLabel.textContent = percent + '%';
    }

    if (percent >= 100 && spinner) {
        spinner.style.borderTopColor = '#10b981';
        spinner.style.animation = 'none';
        spinner.style.borderRadius = '50%';
        spinner.style.backgroundColor = '#10b981';
    }
};
</script>
</body>
</html>
