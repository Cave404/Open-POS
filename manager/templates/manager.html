<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open-POS System Manager</title>
    <link rel="stylesheet" href="/static/css/manager.css">
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="brand-header">
            <span class="brand-badge">POS</span>
            <div class="brand-title">System Manager</div>
        </div>

        <nav class="nav-group">
            <div class="nav-item active" onclick="filterCategory('ALL', this)">
                <span>📂</span> All Tools
            </div>
            <div class="nav-item" onclick="filterCategory('Desktop_Controls', this)">
                <span>🎨</span> Controls & Branding
            </div>
            <div class="nav-item" onclick="filterCategory('Desktop_Tools', this)">
                <span>🔧</span> Maintenance Tools
            </div>
            <div class="nav-item" onclick="filterCategory('System_Admin', this)">
                <span>🛡️</span> Administration
            </div>
            <div class="nav-item" onclick="filterCategory('Desktop_Apps', this)">
                <span>🧩</span> Applets & Addons
            </div>
        </nav>

        <div class="sidebar-footer">
            <span>Engine: Online</span>
            <span>v1.0.0</span>
        </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-content">
        <header class="top-bar">
            <h1 id="viewHeading">System Control Panel</h1>
            <div class="system-status">
                <span class="status-dot"></span>
                <span>Core Local Service Active</span>
            </div>
        </header>

        <div class="view-container">
            <div class="cards-grid" id="toolsGrid">
                <!-- Cards dynamically loaded from /manager/api/applets -->
            </div>
        </div>
    </main>

<script>
let allApplets = [];
const ICONS = {
    'branding': '🎨',
    'database': '💾',
    'network': '🌐',
    'cache': '🧹',
    'logs': '📜',
    'about': 'ℹ️'
};

const DESCRIPTIONS = {
    'branding': 'Configure business legal name, locations, condition multipliers, and payout rates.',
    'database': 'Run database vacuum compaction, health checks, backup dumps, and imports.',
    'network': 'Manage server ports, local network binding, and client monitor connections.',
    'cache': 'Inspect and purge card artwork cache files to reclaim disk space.',
    'logs': 'View live system execution traces, background worker logs, and diagnostic dumps.',
    'about': 'System credits, contributors ledger, and third-party dependency licensing audit.'
};

async function initDashboard() {
    try {
        const res = await fetch('/manager/api/applets');
        allApplets = await res.json();
        renderCards(allApplets);
    } catch (err) {
        console.error('Failed to load applets:', err);
    }
}

function renderCards(list) {
    const grid = document.getElementById('toolsGrid');
    grid.innerHTML = '';

    list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'control-card';
        const icon = ICONS[item.id] || (item.is_addon ? '🧩' : '⚙️');
        const desc = DESCRIPTIONS[item.id] || 'Custom system module or installed add-on extension.';
        const categoryClean = item.category.replace('_', ' ');

        card.innerHTML = `
            <div class="card-header">
                <div class="card-icon">${icon}</div>
                <div class="card-title">${item.title.replace(/_/g, ' ')}</div>
            </div>
            <div class="card-desc">${desc}</div>
            <div class="card-tag">${categoryClean}</div>
        `;

        card.onclick = () => {
            window.location.href = item.target;
        };

        grid.appendChild(card);
    });
}

function filterCategory(cat, el) {
    document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
    el.classList.add('active');

    if (cat === 'ALL') {
        document.getElementById('viewHeading').textContent = 'System Control Panel';
        renderCards(allApplets);
    } else {
        document.getElementById('viewHeading').textContent = cat.replace('_', ' ');
        const filtered = allApplets.filter(a => a.category === cat);
        renderCards(filtered);
    }
}

initDashboard();
</script>
</body>
</html>
