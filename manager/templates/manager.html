<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open-POS System Manager</title>
    <link rel="stylesheet" href="/static/css/manager.css">
    <script src="/static/js/notifications.js"></script>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="brand-header">
            <img id="sidebarLogoImg" class="sidebar-logo-img" src="" alt="Store Logo" style="display:none;">
            <span class="brand-badge" id="sidebarBrandBadge">POS</span>
            <div style="display: flex; flex-direction: column; overflow: hidden; min-width: 0;">
                <div class="brand-title" id="sidebarStoreName" title="Open-POS">Open-POS</div>
                <div style="font-size: 11px; color: var(--text-muted); font-weight: 500;">System Manager</div>
            </div>
        </div>

        <nav class="nav-group">
            <div class="nav-item active" onclick="filterCategory('HOME', this)">
                <span>🏠</span> Home
            </div>
            <div class="nav-item" onclick="filterCategory('ALL', this)">
                <span>📂</span> All Tools
            </div>
            <div class="nav-item" onclick="filterCategory('Desktop_Controls', this)">
                <span>🎨</span> Controls &amp; Branding
            </div>
            <div class="nav-item" onclick="filterCategory('Desktop_Tools', this)">
                <span>🔧</span> Maintenance Tools
            </div>
            <div class="nav-item" onclick="filterCategory('System_Admin', this)">
                <span>🛡️</span> Administration
            </div>
            <div class="nav-item" onclick="filterCategory('Desktop_Apps', this)">
                <span>🧩</span> Applets &amp; Addons
            </div>
        </nav>

        <div class="sidebar-footer">
            <span>Engine: Online</span>
            <a href="/manager/about" class="version-badge-link" title="View System Credits &amp; Documentation">v1.0.4</a>
        </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-content">
        <header class="top-bar">
            <h1 id="viewHeading">Quick-Access Dashboard</h1>
            <div class="system-status">
                <!-- Live Notifications Trigger -->
                <div class="notification-wrapper">
                    <button id="notifBellBtn" class="btn-icon-tray" title="System Notifications">
                        🔔 <span id="notifBadge" class="badge-count" style="display: none;">0</span>
                    </button>
                    <div id="notifDropdown" class="notif-dropdown-menu" style="display: none;">
                        <div class="notif-dropdown-header">
                            <span>System Notifications</span>
                            <button id="clearNotifsBtn" class="btn-text-action">Clear</button>
                        </div>
                        <div id="notifList" class="notif-dropdown-body">
                            <!-- Populated dynamically -->
                        </div>
                        <div class="notif-dropdown-footer">
                            <a href="/manager/logs" class="btn-full-action">Open Terminal Logs →</a>
                        </div>
                    </div>
                </div>
                <span class="status-pill status-online">Engine: Online</span>
            </div>
        </header>

        <div class="view-container">
            <!-- Dedicated Tools Grid -->
            <div class="cards-grid" id="toolsGrid">
                <!-- Cards dynamically loaded -->
            </div>
        </div>
    </main>

<script>
let allApplets = [];
let currentCategory = 'HOME';
let pinnedTools = [];

const ICONS = {
    'branding': '🎨',
    'database': '💾',
    'network': '🌐',
    'cache': '🧹',
    'logs': '📜',
    'about': 'ℹ️',
    'configure_manager': '🛡️'
};

const DESCRIPTIONS = {
    'branding': 'Configure business legal name, locations, condition multipliers, and payout rates.',
    'database': 'Run database vacuum compaction, health checks, backup dumps, and imports.',
    'network': 'Manage server ports, local network binding, and client monitor connections.',
    'cache': 'Inspect and purge card artwork cache files to reclaim disk space.',
    'logs': 'View live system execution traces, background worker logs, and diagnostic dumps.',
    'about': 'System credits, contributors ledger, and third-party dependency licensing audit.',
    'configure_manager': 'Manager PIN/password protection, startup bypass modes, and dependency upgrade tooling.'
};

async function initDashboard() {
    try {
        // 1. Fetch Applets
        const appletsRes = await fetch('/manager/api/applets');
        if (appletsRes.ok) {
            allApplets = await appletsRes.json();
        }

        // 2. Fetch System Settings (Store Name, Logo, Pinned Tools)
        await loadSettingsAndBranding();

        // 3. Render Dashboard (Defaults to HOME)
        renderGrid();
    } catch (err) {
        console.error('Failed to initialize dashboard:', err);
    }
}

async function loadSettingsAndBranding() {
    try {
        const res = await fetch('/api/settings');
        if (!res.ok) return;
        const settings = await res.json();

        // Sync Store Logo
        const logoImg = document.getElementById('sidebarLogoImg');
        const badge = document.getElementById('sidebarBrandBadge');
        if (settings.store_logo_url && settings.store_logo_url.trim() !== '') {
            logoImg.src = settings.store_logo_url + (settings.store_logo_url.includes('?') ? '&' : '?') + 't=' + Date.now();
            logoImg.style.display = 'block';
            badge.style.display = 'none';
        } else {
            logoImg.style.display = 'none';
            badge.style.display = 'inline-flex';
        }

        // Sync Store Name
        if (settings.store_name && settings.store_name.trim() !== '') {
            const nameEl = document.getElementById('sidebarStoreName');
            nameEl.textContent = settings.store_name;
            nameEl.title = settings.store_name;
        }

        // Sync Pinned Tools from localStorage or backend
        const localPinned = localStorage.getItem('openpos_pinned_tools');
        if (localPinned) {
            try {
                pinnedTools = JSON.parse(localPinned);
            } catch (e) {
                pinnedTools = [];
            }
        } else if (settings.pinned_tools) {
            if (Array.isArray(settings.pinned_tools)) {
                pinnedTools = settings.pinned_tools;
            } else if (typeof settings.pinned_tools === 'string') {
                try {
                    pinnedTools = JSON.parse(settings.pinned_tools);
                } catch (e) {
                    pinnedTools = ['branding', 'database'];
                }
            }
            localStorage.setItem('openpos_pinned_tools', JSON.stringify(pinnedTools));
        } else {
            pinnedTools = ['branding', 'database'];
            localStorage.setItem('openpos_pinned_tools', JSON.stringify(pinnedTools));
        }
    } catch (err) {
        console.warn('Error loading branding settings:', err);
        const localPinned = localStorage.getItem('openpos_pinned_tools');
        if (localPinned) {
            try { pinnedTools = JSON.parse(localPinned); } catch(e) {}
        }
    }
}

function createCardElement(item, isPinned) {
    const card = document.createElement('div');
    card.className = 'control-card' + (isPinned ? ' pinned' : '');
    card.id = `card-${item.id}`;
    const icon = ICONS[item.id] || (item.is_addon ? '🧩' : '⚙️');
    const desc = DESCRIPTIONS[item.id] || 'Custom system module or installed add-on extension.';
    const categoryClean = item.category.replace('_', ' ');

    card.innerHTML = `
        <button class="pin-btn" title="${isPinned ? 'Unpin from Quick Access' : 'Pin to Quick Access'}" onclick="togglePin('${item.id}', event)">📌</button>
        <div class="card-header">
            <div class="card-icon">${icon}</div>
            <div class="card-title">${item.title.replace(/_/g, ' ')}</div>
        </div>
        <div class="card-desc">${desc}</div>
        <div class="card-tag">${categoryClean}</div>
    `;

    card.onclick = (e) => {
        if (e.target.closest('.pin-btn')) return;
        window.location.href = item.target;
    };

    return card;
}

function renderGrid() {
    const grid = document.getElementById('toolsGrid');
    grid.innerHTML = '';

    if (currentCategory === 'HOME') {
        const pinnedList = allApplets.filter(item => pinnedTools.includes(item.id));
        if (pinnedList.length === 0) {
            grid.innerHTML = `
                <div class="empty-pinned-card">
                    <div class="empty-icon">📌</div>
                    <h3>No quick-access tools pinned yet.</h3>
                    <p>Browse the categories in the sidebar and click the 📌 icon on any card to pin it here.</p>
                </div>
            `;
            return;
        }
        pinnedList.forEach(item => {
            grid.appendChild(createCardElement(item, true));
        });
        return;
    }

    const list = currentCategory === 'ALL'
        ? allApplets
        : allApplets.filter(a => a.category === currentCategory);

    list.forEach(item => {
        const isPinned = pinnedTools.includes(item.id);
        grid.appendChild(createCardElement(item, isPinned));
    });
}

async function togglePin(id, event) {
    if (event) event.stopPropagation();

    const idx = pinnedTools.indexOf(id);
    const isNowPinned = idx === -1;

    if (isNowPinned) {
        pinnedTools.push(id);
    } else {
        pinnedTools.splice(idx, 1);
    }

    // 1. Immediate client-side persistence
    localStorage.setItem('openpos_pinned_tools', JSON.stringify(pinnedTools));

    // 2. Immediate UI Update
    if (currentCategory === 'HOME') {
        renderGrid();
    } else {
        const card = document.getElementById(`card-${id}`);
        if (card) {
            if (isNowPinned) {
                card.classList.add('pinned');
                const btn = card.querySelector('.pin-btn');
                if (btn) btn.title = 'Unpin from Quick Access';
            } else {
                card.classList.remove('pinned');
                const btn = card.querySelector('.pin-btn');
                if (btn) btn.title = 'Pin to Quick Access';
            }
        }
    }

    // 3. Backend persistence sync
    try {
        await fetch('/api/settings/pinned', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pinned_tools: pinnedTools, pinned: pinnedTools })
        });
    } catch (err) {
        console.warn('Failed to sync pinned tools with backend:', err);
    }
}

function filterCategory(cat, el) {
    document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
    el.classList.add('active');
    currentCategory = cat;

    if (cat === 'HOME') {
        document.getElementById('viewHeading').textContent = 'Quick-Access Dashboard';
    } else if (cat === 'ALL') {
        document.getElementById('viewHeading').textContent = 'System Control Panel';
    } else {
        document.getElementById('viewHeading').textContent = cat.replace(/_/g, ' ');
    }
    renderGrid();
}

document.addEventListener('DOMContentLoaded', initDashboard);
</script>
</body>
</html>
