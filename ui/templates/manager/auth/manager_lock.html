<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Authentication Required - Open-POS</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/manager.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f1117;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: #f1f5f9;
            min-height: 100vh;
        }
        .lock-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.12);
            color: #3b82f6;
            margin: 0 auto;
        }
        .btn-outline-secondary {
            background: transparent;
            color: #94a3b8;
            border: 1px solid #3d4455;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
            text-align: center;
        }
        .btn-outline-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #f1f5f9;
            border-color: #64748b;
        }
        .version-badge {
            display: block;
            margin-top: 1.5rem;
            font-size: 11px;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="auth-lock-wrapper">
    <div class="auth-lock-card p-4 text-center">
        <div class="lock-icon mb-3">
            <svg width="44" height="44" fill="#58a6ff" viewBox="0 0 16 16">
                <path d="M8 1a2 2 0 0 0-2 2v4H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2m0 1a1 1 0 0 1 1 1v4H7V3a1 1 0 0 1 1-1"/>
            </svg>
        </div>
        <h4 class="fw-bold mb-1 text-white">Manager Authentication Required</h4>
        <p class="text-muted small mb-4">Enter administrative PIN to access this section.</p>

        <form id="managerLockForm">
            <input type="hidden" id="nextUrl" value="{{ next_url }}">
            <div class="mb-3">
                <input type="password" 
                       id="adminPinInput" 
                       class="form-control form-control-lg text-center bg-dark text-white border-secondary" 
                       placeholder="Enter PIN" 
                       autocomplete="off" 
                       autofocus 
                       required>
                <div id="pinError" class="invalid-feedback text-danger small mt-2 d-none"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 mb-2" id="btnSubmitUnlock">
                Unlock Section
            </button>
            <a href="/manager" class="btn btn-outline-secondary w-100 mb-2" id="btnReturnDashboard">
                Return to Dashboard
            </a>
            <a href="/pos" class="btn btn-outline-secondary w-100" id="btnReturnRegister">
                Return to Register
            </a>
        </form>
        <span class="version-badge">Open-POS v{{ config_version or '1.0.10' }}</span>
    </div>
</div>
<script src="/static/js/auth_lock.js"></script>
</body>
</html>
